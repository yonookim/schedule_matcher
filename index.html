<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일정 조율</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf3 100%);
    min-height: 100vh;
    color: #2d3748;
    padding: 20px;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    background: #fff;
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.06);
  }

  h1 {
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
    color: #1a202c;
  }

  .project-title {
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    color: #1a202c;
    margin-bottom: 4px;
  }

  .subtitle {
    text-align: center;
    color: #718096;
    font-size: 14px;
    margin-bottom: 20px;
  }

  /* ---------- 연결 상태 ---------- */
  .connection-banner {
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 12px;
    text-align: center;
    margin-bottom: 18px;
    font-weight: 500;
  }

  .connection-banner.online { background: #d1fae5; color: #065f46; }
  .connection-banner.offline { background: #fef3c7; color: #92400e; }
  .connection-banner.error { background: #fee2e2; color: #991b1b; }
  .connection-banner.saving { background: #e0e7ff; color: #3730a3; }

  /* ---------- 폼 ---------- */
  .form-group { margin-bottom: 20px; }

  .form-label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #2d3748;
    margin-bottom: 8px;
  }

  .form-input {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }

  .form-input:focus { border-color: #667eea; }

  .number-input-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
  }

  .number-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid #e2e8f0;
    background: #fff;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    color: #4a5568;
    transition: all 0.15s;
  }

  .number-btn:hover:not(:disabled) {
    background: #f0f4ff;
    border-color: #667eea;
    color: #667eea;
  }

  .number-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .number-display {
    font-size: 28px;
    font-weight: 800;
    color: #1a202c;
    min-width: 70px;
    text-align: center;
  }

  .number-unit { font-size: 14px; color: #718096; margin-left: -8px; }

  /* ---------- 아바타 ---------- */
  .avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    margin: 0 auto 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 22px;
  }

  .avatar-0 { background: linear-gradient(135deg, #667eea, #764ba2); }
  .avatar-1 { background: linear-gradient(135deg, #f093fb, #f5576c); }
  .avatar-2 { background: linear-gradient(135deg, #4facfe, #00f2fe); }
  .avatar-3 { background: linear-gradient(135deg, #43e97b, #38f9d7); }
  .avatar-4 { background: linear-gradient(135deg, #fa709a, #fee140); }
  .avatar-5 { background: linear-gradient(135deg, #30cfd0, #330867); }
  .avatar-6 { background: linear-gradient(135deg, #a8edea, #fed6e3); color: #4a5568; }
  .avatar-7 { background: linear-gradient(135deg, #ff9a9e, #fad0c4); color: #4a5568; }

  /* ---------- 참여 멤버 ---------- */
  .members-section {
    margin-top: 24px;
    padding: 16px;
    background: #f8fafc;
    border-radius: 12px;
  }

  .members-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .members-title { font-size: 13px; font-weight: 600; color: #4a5568; }

  .members-count {
    font-size: 11px;
    color: #718096;
    font-weight: 600;
    background: #fff;
    padding: 4px 10px;
    border-radius: 20px;
  }

  .members-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 10px;
  }

  .member-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .member-chip .avatar {
    width: 44px;
    height: 44px;
    font-size: 16px;
    margin: 0;
    position: relative;
  }

  .member-chip.done .avatar::after {
    content: "✓";
    position: absolute;
    bottom: -2px;
    right: -2px;
    background: #38a169;
    color: #fff;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #fff;
  }

  .member-chip .member-name {
    font-size: 12px;
    color: #4a5568;
    text-align: center;
    max-width: 80px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .member-chip.me .member-name { color: #667eea; font-weight: 700; }

  .member-empty {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px dashed #cbd5e0;
    background: transparent;
  }

  /* ---------- 버튼 ---------- */
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
  .btn-primary:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(102,126,234,0.35);
  }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-secondary { background: #edf2f7; color: #4a5568; margin-top: 10px; }
  .btn-secondary:hover { background: #e2e8f0; }

  .btn-ghost {
    background: transparent;
    color: #667eea;
    font-size: 13px;
    padding: 8px;
    margin-top: 10px;
  }

  .btn-danger-ghost {
    background: transparent;
    color: #e53e3e;
    font-size: 13px;
    padding: 8px;
    margin-top: 4px;
  }

  /* ---------- 캘린더 ---------- */
  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .month-nav {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    width: 36px;
    height: 36px;
    cursor: pointer;
    font-size: 18px;
    color: #4a5568;
  }

  .month-nav:hover { background: #edf2f7; }

  .month-title { font-size: 18px; font-weight: 700; }

  .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }

  .day-label {
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: #718096;
    padding: 8px 0;
  }

  .day-label.sun { color: #e53e3e; }
  .day-label.sat { color: #3182ce; }

  .day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 500;
    transition: all 0.15s;
    background: #f8fafc;
    color: #2d3748;
    position: relative;
    user-select: none;
  }

  .day.empty { background: transparent; cursor: default; }
  .day.past { color: #cbd5e0; background: transparent; cursor: not-allowed; }
  .day:not(.empty):not(.past):hover { background: #e2e8f0; }

  .day.unavailable {
    background: #fed7d7;
    color: #c53030;
    font-weight: 700;
    text-decoration: line-through;
  }

  .day.faded {
    color: #cbd5e0;
    background: #f8fafc;
    font-weight: 400;
  }

  .day.available {
    color: #1a202c;
    font-weight: 700;
    background: #f8fafc;
  }

  .day.highlighted {
    background: #fef9c3;
    color: #713f12;
    font-weight: 800;
    box-shadow: 0 0 0 2px #fde047 inset;
  }

  .day-indicator {
    position: absolute;
    bottom: 3px;
    font-size: 9px;
    color: #a0aec0;
    font-weight: 500;
  }

  .day.unavailable .day-indicator { color: #c53030; }

  /* ---------- 정보 박스 ---------- */
  .info-box {
    background: #f0f4ff;
    border-left: 3px solid #667eea;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    color: #4a5568;
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 18px;
    font-size: 12px;
    color: #4a5568;
  }

  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-swatch { width: 16px; height: 16px; border-radius: 4px; }

  .current-user {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f8fafc;
    padding: 10px 14px;
    border-radius: 12px;
    margin-bottom: 18px;
  }

  .current-user .avatar {
    width: 36px;
    height: 36px;
    font-size: 14px;
    margin: 0;
  }

  .current-user-info { flex: 1; font-size: 14px; }
  .current-user-info b { color: #1a202c; }
  .current-user-info span { color: #718096; font-size: 12px; display: block; }

  .summary {
    background: #fef9c3;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 18px;
    text-align: center;
  }

  .summary-title { font-size: 13px; color: #713f12; margin-bottom: 8px; font-weight: 600; }
  .summary-dates { font-size: 15px; font-weight: 700; color: #713f12; line-height: 1.6; }
  .summary-empty { color: #92400e; font-size: 13px; }

  .hidden { display: none !important; }

  .room-badge {
    background: #f0f4ff;
    border: 1px dashed #c3dafe;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 12px;
    color: #4a5568;
    margin-bottom: 16px;
    text-align: center;
  }

  .full-warning {
    background: #fee2e2;
    color: #991b1b;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 16px;
  }

  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    font-size: 14px;
    color: #4a5568;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(45, 55, 72, 0.95);
    color: #fff;
    padding: 12px 20px;
    border-radius: 24px;
    font-size: 13px;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }

  .toast.show { opacity: 1; }

  @media (max-width: 480px) {
    .container { padding: 24px 18px; }
    .day { font-size: 13px; }
    .legend { font-size: 11px; }
  }
</style>
</head>
<body>

<div id="loading" class="loading-overlay">⏳ 불러오는 중...</div>
<div id="toast" class="toast"></div>

<div class="container">

  <div id="connection-banner" class="connection-banner offline">⏳ 연결 중...</div>

  <!-- ========== 화면 1: 호스트 설정 ========== -->
  <div id="screen-host" class="hidden">
    <h1>🎯 새 일정 조율 만들기</h1>
    <p class="subtitle">프로젝트 정보를 입력하세요</p>

    <div id="room-badge-host" class="room-badge"></div>

    <div class="form-group">
      <label class="form-label">프로젝트 이름</label>
      <input type="text" class="form-input" id="project-name-input" placeholder="예: 면접 스터디 일정 조율" maxlength="40">
    </div>

    <div class="form-group">
      <label class="form-label">참가 가능 인원수 (2~8명)</label>
      <div class="number-input-wrap">
        <button class="number-btn" id="member-minus" onclick="changeMaxMembers(-1)">−</button>
        <div class="number-display"><span id="max-members-display">4</span><span class="number-unit">명</span></div>
        <button class="number-btn" id="member-plus" onclick="changeMaxMembers(1)">+</button>
      </div>
    </div>

    <button class="btn btn-primary" onclick="createProject()">✨ 만들고 시작하기</button>
  </div>

  <!-- ========== 화면 2: 참여 ========== -->
  <div id="screen-join" class="hidden">
    <div class="project-title" id="project-title-join"></div>
    <p class="subtitle">본인 프로필을 등록해주세요</p>

    <div id="room-badge-join" class="room-badge"></div>

    <div id="full-warning-box"></div>

    <div class="form-group">
      <label class="form-label">본인 닉네임 (이름)</label>
      <input type="text" class="form-input" id="my-name-input" placeholder="예: 김지영" maxlength="15">
    </div>

    <button class="btn btn-primary" id="join-btn" onclick="joinAsMember()">✏ 프로필 만들고 입장하기</button>

    <div class="members-section">
      <div class="members-header">
        <span class="members-title">📋 참여 중인 멤버</span>
        <span class="members-count" id="member-count-badge">0/4</span>
      </div>
      <div class="members-grid" id="join-members-list"></div>
    </div>

    <button class="btn btn-secondary" onclick="refreshAndShowResults()">📊 결과만 보기</button>
    <button class="btn btn-ghost" onclick="refreshData()">🔄 새로고침</button>
  </div>

  <!-- ========== 화면 3: 캘린더 ========== -->
  <div id="screen-calendar" class="hidden">
    <div class="project-title" id="project-title-cal"></div>
    <p class="subtitle">참석 불가능한 모든 날짜를 클릭해주세요</p>

    <div class="current-user" id="current-user-box"></div>

    <div class="info-box">
      💡 날짜를 클릭하면 "안되는 날"로 표시되고 자동 저장돼요. 다른 사람들이 다음 접속할 때 반영됩니다.
    </div>

    <div class="calendar-header">
      <button class="month-nav" onclick="changeMonth(-1)">‹</button>
      <div class="month-title" id="month-title"></div>
      <button class="month-nav" onclick="changeMonth(1)">›</button>
    </div>

    <div class="calendar" id="calendar"></div>

    <button class="btn btn-primary" id="submit-btn" onclick="submitAvailability()" style="margin-top:20px">제출하고 결과 보기</button>
    <button class="btn btn-secondary" onclick="refreshAndShowResults()">📊 결과 보기</button>
    <button class="btn btn-danger-ghost" onclick="resetCurrentUser()">🗑 본인 선택 초기화</button>
    <button class="btn btn-ghost" onclick="leaveMyProfile()" style="color:#a0aec0">프로필 변경/탈퇴</button>
  </div>

  <!-- ========== 화면 4: 결과 ========== -->
  <div id="screen-result" class="hidden">
    <div class="project-title" id="project-title-result"></div>
    <p class="subtitle">📊 진한 글씨 = 모두 가능 · 노란색 = 전원 제출 완료</p>

    <div class="members-section">
      <div class="members-header">
        <span class="members-title">📋 참여 현황</span>
        <span class="members-count" id="result-count-badge">0/4</span>
      </div>
      <div class="members-grid" id="result-members-list"></div>
    </div>

    <div class="summary" id="summary-box"></div>

    <div class="legend">
      <div class="legend-item"><div class="legend-swatch" style="background:#fef9c3;box-shadow:0 0 0 2px #fde047 inset"></div>모두 가능</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#f8fafc;border:1px solid #e2e8f0"></div>가능</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#f8fafc"></div><span style="color:#cbd5e0">불가능</span></div>
    </div>

    <div class="calendar-header">
      <button class="month-nav" onclick="changeMonth(-1)">‹</button>
      <div class="month-title" id="result-month-title"></div>
      <button class="month-nav" onclick="changeMonth(1)">›</button>
    </div>

    <div class="calendar" id="result-calendar"></div>

    <button class="btn btn-primary" id="back-to-cal-btn" onclick="goToCalendar()" style="margin-top:20px">← 내 캘린더로 돌아가기</button>
    <button class="btn btn-secondary" onclick="refreshData()">🔄 최신으로 새로고침</button>
    <button class="btn btn-ghost" onclick="copyRoomLink()">🔗 그룹 링크 복사하기</button>
  </div>

</div>

<script>
// ===== 저장소 (jsonblob.com + CORS 프록시 fallback) =====
  const DIRECT_API = "https://jsonblob.com/api/jsonBlob";
  const STORAGE_BACKENDS = [
    { name: "direct",     wrap: (u) => u },
    { name: "corsproxy",  wrap: (u) => "https://corsproxy.io/?" + encodeURIComponent(u) },
    { name: "allorigins", wrap: (u) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u) }
  ];
  const LOCAL_PREFIX = "scheduler-v4";

  async function tryBackends(buildUrl, fetchOpts, okStatuses = [200, 201, 204, 404]) {
    let lastErr;
    for (const backend of STORAGE_BACKENDS) {
      try {
        const url = backend.wrap(buildUrl());
        const res = await fetch(url, fetchOpts);
        if (res.ok || okStatuses.includes(res.status)) return res;
        lastErr = new Error("HTTP " + res.status + " via " + backend.name);
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error("all backends failed");
  }

  async function createBlob(data) {
    // 프록시는 Location 헤더를 자주 못 가져오니, 우선 직접 POST 시도
    const opts = {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(data)
    };
    // 직접 호출 시도
    try {
      const res = await fetch(DIRECT_API, opts);
      if (res.ok) {
        const loc = res.headers.get("Location");
        if (loc) {
          const parts = loc.split("/");
          return parts[parts.length - 1];
        }
      }
    } catch (e) { /* fallback below */ }
    // fallback: 프록시 경유 POST (Location 못 읽으면 응답 body의 id 사용 시도)
    const res = await tryBackends(() => DIRECT_API, opts, [200, 201]);
    const loc = res.headers.get("Location");
    if (loc) {
      const parts = loc.split("/");
      return parts[parts.length - 1];
    }
    // 일부 프록시는 Location 헤더를 숨기므로 랜덤 id 생성해서 PUT으로 저장
    const newId = "r_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    await updateBlob(newId, data);
    return newId;
  }

  async function readBlob(id) {
    const res = await tryBackends(
      () => DIRECT_API + "/" + id,
      { headers: { "Accept": "application/json" } }
    );
    if (res.status === 404) return null;
    if (!res.ok) throw new Error("blob read failed: " + res.status);
    return await res.json();
  }

  async function updateBlob(id, data) {
    const res = await tryBackends(
      () => DIRECT_API + "/" + id,
      {
        method: "PUT",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(data)
      }
    );
    if (!res.ok) throw new Error("blob update failed: " + res.status);
    return true;
  }

  // ===== 상태 =====
  let state = {
    room: null,
    myMemberId: null,
    currentScreen: null,
    viewYear: new Date().getFullYear(),
    viewMonth: new Date().getMonth()
  };

  let initialDataLoaded = false;
  let saveTimer = null;
  let pendingSave = false;

  // ===== 유틸 =====
  function generateMemberId() {
    return "m_" + Math.random().toString(36).substr(2, 8) + Date.now().toString(36).substr(-4);
  }

  function getMyMemberKey() {
    return LOCAL_PREFIX + "-myid-" + (window._roomId || "default");
  }

  function loadMyMemberId() {
    state.myMemberId = localStorage.getItem(getMyMemberKey()) || null;
  }

  function saveMyMemberId(id) {
    state.myMemberId = id;
    if (id) localStorage.setItem(getMyMemberKey(), id);
    else localStorage.removeItem(getMyMemberKey());
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function getInitial(name) { return name ? name.trim().charAt(0) : "?"; }

  function memberIndex(memberId) {
    if (!state.room || !state.room.members) return 0;
    const ids = Object.keys(state.room.members).sort();
    return Math.max(0, ids.indexOf(memberId)) % 8;
  }

  function showToast(msg, duration) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => t.classList.remove("show"), duration || 2000);
  }

  function setBanner(state, msg) {
    const b = document.getElementById("connection-banner");
    b.className = "connection-banner " + state;
    b.textContent = msg;
  }

  // ===== 저장 (디바운스) =====
  function saveRoom() {
    if (!state.room || !window._roomId) return;
    state.room.updatedAt = Date.now();
    pendingSave = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      setBanner("saving", "💾 저장 중...");
      try {
        await updateBlob(window._roomId, state.room);
        setBanner("online", "🟢 저장 완료 · 다른 기기에서 새로고침하면 즉시 반영됩니다");
        pendingSave = false;
      } catch (e) {
        console.error(e);
        setBanner("error", "⚠ 저장 실패 - 인터넷 확인 후 다시 시도해주세요");
        // 재시도
        setTimeout(saveRoom, 3000);
      }
    }, 400);
  }

  // ===== 새로고침 (서버에서 최신 데이터 가져오기) =====
  async function refreshData() {
    if (!window._roomId) return;
    setBanner("saving", "🔄 최신 데이터 불러오는 중...");
    try {
      const data = await readBlob(window._roomId);
      if (data && !data.__empty) {
        state.room = data;
      } else if (!data) {
        // 방이 사라짐 (만료 등)
        setBanner("error", "⚠ 방을 찾을 수 없어요. 만료되었을 수 있습니다.");
        return;
      }
      setBanner("online", "🟢 최신 데이터로 동기화됨");
      showToast("불러오기 완료 ✓");
      routeToCorrectScreen();
    } catch (e) {
      console.error(e);
      setBanner("error", "⚠ 불러오기 실패 - 인터넷 확인");
    }
  }

  // ===== 라우팅 =====
  function routeToCorrectScreen() {
    if (!initialDataLoaded) return;

    if (!state.room || !state.room.projectName) {
      showScreen("host");
      renderHostScreen();
      return;
    }

    loadMyMemberId();
    if (state.myMemberId && state.room.members && state.room.members[state.myMemberId]) {
      showScreen("calendar");
      renderCalendarScreen();
    } else {
      showScreen("join");
      renderJoinScreen();
    }
  }

  function showScreen(name) {
    state.currentScreen = name;
    ["host","join","calendar","result"].forEach(s => {
      document.getElementById("screen-" + s).classList.add("hidden");
    });
    document.getElementById("screen-" + name).classList.remove("hidden");
    window.scrollTo(0, 0);
  }

  // ===== 화면 1: 호스트 설정 =====
  let hostMaxMembers = 4;

  function renderHostScreen() {
    document.getElementById("max-members-display").textContent = hostMaxMembers;
    document.getElementById("member-minus").disabled = hostMaxMembers <= 2;
    document.getElementById("member-plus").disabled = hostMaxMembers >= 8;
    document.getElementById("room-badge-host").innerHTML =
      `🏠 그룹 코드: <b style="color:#4c51bf">${window._roomId || "—"}</b><br>
       <span style="font-size:11px">설정 완료 후 이 페이지 URL을 멤버들에게 공유하세요</span>`;
  }

  function changeMaxMembers(delta) {
    hostMaxMembers = Math.max(2, Math.min(8, hostMaxMembers + delta));
    renderHostScreen();
  }

  function createProject() {
    const nameEl = document.getElementById("project-name-input");
    const name = nameEl.value.trim();
    if (!name) {
      alert("프로젝트 이름을 입력해주세요.");
      nameEl.focus();
      return;
    }
    state.room = {
      projectName: name,
      maxMembers: hostMaxMembers,
      members: {},
      createdAt: Date.now()
    };
    saveRoom();
    showScreen("join");
    renderJoinScreen();
  }

  // ===== 화면 2: 참여 =====
  function renderJoinScreen() {
    document.getElementById("project-title-join").textContent = "🎯 " + (state.room.projectName || "");
    document.getElementById("room-badge-join").innerHTML =
      `🏠 그룹 코드: <b style="color:#4c51bf">${window._roomId || "—"}</b><br>
       <span style="font-size:11px">이 페이지 URL을 멤버들에게 공유하세요</span>`;

    const members = state.room.members || {};
    const memberIds = Object.keys(members);
    const count = memberIds.length;
    const max = state.room.maxMembers || 4;

    document.getElementById("member-count-badge").textContent = `${count}/${max}`;

    const grid = document.getElementById("join-members-list");
    grid.innerHTML = "";

    memberIds.forEach((mid, idx) => {
      const m = members[mid];
      const chip = document.createElement("div");
      chip.className = "member-chip" + (m.submitted ? " done" : "") + (mid === state.myMemberId ? " me" : "");
      chip.innerHTML = `
        <div class="avatar avatar-${idx % 8}">${getInitial(m.name)}</div>
        <div class="member-name">${escapeHtml(m.name)}</div>
      `;
      grid.appendChild(chip);
    });

    for (let i = count; i < max; i++) {
      const empty = document.createElement("div");
      empty.className = "member-chip";
      empty.innerHTML = `<div class="member-empty"></div><div class="member-name" style="color:#cbd5e0">빈 자리</div>`;
      grid.appendChild(empty);
    }

    const fullBox = document.getElementById("full-warning-box");
    const joinBtn = document.getElementById("join-btn");
    const nameInput = document.getElementById("my-name-input");
    if (count >= max) {
      fullBox.innerHTML = `<div class="full-warning">⚠ 인원이 모두 찼습니다 (${count}/${max}). 새로 참여할 수 없어요. 결과 보기는 가능합니다.</div>`;
      joinBtn.disabled = true;
      nameInput.disabled = true;
      nameInput.placeholder = "참여 불가";
    } else {
      fullBox.innerHTML = "";
      joinBtn.disabled = false;
      nameInput.disabled = false;
      nameInput.placeholder = "예: 김지영";
    }
  }

  async function joinAsMember() {
    const nameEl = document.getElementById("my-name-input");
    const name = nameEl.value.trim();
    if (!name) {
      alert("닉네임을 입력해주세요.");
      nameEl.focus();
      return;
    }

    // 참여 전 한 번 더 새로고침 (정원 체크)
    setBanner("saving", "🔄 최신 정보 확인 중...");
    try {
      const fresh = await readBlob(window._roomId);
      if (fresh) state.room = fresh;
    } catch(e) { /* ignore */ }

    const members = state.room.members || {};
    const count = Object.keys(members).length;
    const max = state.room.maxMembers || 4;

    if (count >= max) {
      alert(`인원이 모두 찼습니다 (${count}/${max}). 참여할 수 없어요.`);
      renderJoinScreen();
      return;
    }

    if (Object.values(members).some(m => m.name === name)) {
      if (!confirm(`"${name}" 이름이 이미 있어요. 그래도 등록할까요?`)) return;
    }

    const newId = generateMemberId();
    state.room.members = state.room.members || {};
    state.room.members[newId] = {
      name: name,
      unavailable: [],
      submitted: false,
      joinedAt: Date.now()
    };
    saveMyMemberId(newId);
    saveRoom();
    showScreen("calendar");
    renderCalendarScreen();
  }

  function leaveMyProfile() {
    if (!confirm("이 프로필을 탈퇴하고 다시 등록 화면으로 이동할까요?\n(본인의 선택 데이터가 모두 삭제됩니다)")) return;
    if (state.myMemberId && state.room && state.room.members) {
      delete state.room.members[state.myMemberId];
      saveRoom();
    }
    saveMyMemberId(null);
    showScreen("join");
    renderJoinScreen();
  }

  // ===== 화면 3: 캘린더 =====
  function renderCalendarScreen() {
    document.getElementById("project-title-cal").textContent = "🎯 " + state.room.projectName;
    renderCurrentUser();
    renderCalendar();
  }

  function renderCurrentUser() {
    const box = document.getElementById("current-user-box");
    if (!box) return;
    const me = state.room.members[state.myMemberId];
    if (!me) return;
    const count = (me.unavailable || []).length;
    const idx = memberIndex(state.myMemberId);
    box.innerHTML = `
      <div class="avatar avatar-${idx}">${getInitial(me.name)}</div>
      <div class="current-user-info">
        <b>${escapeHtml(me.name)}</b>
        <span>안되는 날 ${count}일 선택됨 ${me.submitted ? '· <span style="color:#38a169;font-weight:600">✓ 제출 완료 (수정 가능)</span>' : ''}</span>
      </div>
    `;
    const btn = document.getElementById("submit-btn");
    if (btn) btn.textContent = me.submitted ? "💾 수정사항 저장하고 결과 보기" : "제출하고 결과 보기";
  }

  function changeMonth(delta) {
    state.viewMonth += delta;
    if (state.viewMonth < 0) { state.viewMonth = 11; state.viewYear--; }
    if (state.viewMonth > 11) { state.viewMonth = 0; state.viewYear++; }
    renderCalendar();
    renderResultCalendar();
  }

  function dateKey(y, m, d) {
    return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  function renderCalendar() {
    const cal = document.getElementById("calendar");
    if (!cal) return;
    document.getElementById("month-title").textContent = `${state.viewYear}년 ${state.viewMonth+1}월`;

    const today = new Date();
    today.setHours(0,0,0,0);

    const firstDay = new Date(state.viewYear, state.viewMonth, 1).getDay();
    const daysInMonth = new Date(state.viewYear, state.viewMonth+1, 0).getDate();

    cal.innerHTML = "";
    ["일","월","화","수","목","금","토"].forEach((l, idx) => {
      const cls = idx === 0 ? "sun" : idx === 6 ? "sat" : "";
      cal.innerHTML += `<div class="day-label ${cls}">${l}</div>`;
    });

    for (let i = 0; i < firstDay; i++) {
      cal.innerHTML += `<div class="day empty"></div>`;
    }

    const me = state.room.members[state.myMemberId];
    const userUnav = (me && me.unavailable) || [];

    for (let d = 1; d <= daysInMonth; d++) {
      const key = dateKey(state.viewYear, state.viewMonth, d);
      const dateObj = new Date(state.viewYear, state.viewMonth, d);
      const isPast = dateObj < today;
      const isUnav = userUnav.includes(key);

      let cls = "day";
      if (isPast) cls += " past";
      if (isUnav) cls += " unavailable";

      const cell = document.createElement("div");
      cell.className = cls;
      cell.textContent = d;
      if (!isPast) cell.onclick = () => toggleDay(key);
      cal.appendChild(cell);
    }
  }

  function toggleDay(key) {
    const me = state.room.members[state.myMemberId];
    if (!me) return;
    me.unavailable = me.unavailable || [];
    const idx = me.unavailable.indexOf(key);
    if (idx >= 0) me.unavailable.splice(idx, 1);
    else me.unavailable.push(key);
    saveRoom();
    renderCalendar();
    renderCurrentUser();
  }

  function resetCurrentUser() {
    const me = state.room.members[state.myMemberId];
    if (!me) return;
    if (!confirm(`${me.name}님의 선택을 모두 지울까요?\n(안되는 날 + 제출 상태 초기화)`)) return;
    me.unavailable = [];
    me.submitted = false;
    saveRoom();
    renderCalendar();
    renderCurrentUser();
  }

  function submitAvailability() {
    const me = state.room.members[state.myMemberId];
    if (!me) return;
    me.submitted = true;
    saveRoom();
    showResults();
  }

  function goToCalendar() {
    if (state.myMemberId && state.room && state.room.members && state.room.members[state.myMemberId]) {
      showScreen("calendar");
      renderCalendarScreen();
    } else {
      showScreen("join");
      renderJoinScreen();
    }
  }

  // ===== 화면 4: 결과 =====
  async function refreshAndShowResults() {
    await refreshData();
    showResults();
  }

  function showResults() {
    showScreen("result");
    renderResultScreen();
  }

  function renderResultScreen() {
    document.getElementById("project-title-result").textContent = "🎯 " + (state.room ? state.room.projectName : "");

    const members = (state.room && state.room.members) || {};
    const memberIds = Object.keys(members);
    const count = memberIds.length;
    const max = (state.room && state.room.maxMembers) || 0;
    document.getElementById("result-count-badge").textContent = `${count}/${max}`;

    const grid = document.getElementById("result-members-list");
    grid.innerHTML = "";
    memberIds.forEach((mid, idx) => {
      const m = members[mid];
      const chip = document.createElement("div");
      chip.className = "member-chip" + (m.submitted ? " done" : "") + (mid === state.myMemberId ? " me" : "");
      chip.innerHTML = `
        <div class="avatar avatar-${idx % 8}">${getInitial(m.name)}</div>
        <div class="member-name">${escapeHtml(m.name)}</div>
      `;
      grid.appendChild(chip);
    });

    for (let i = count; i < max; i++) {
      const empty = document.createElement("div");
      empty.className = "member-chip";
      empty.innerHTML = `<div class="member-empty"></div><div class="member-name" style="color:#cbd5e0">빈 자리</div>`;
      grid.appendChild(empty);
    }

    document.getElementById("back-to-cal-btn").style.display = state.myMemberId ? "" : "none";

    renderResultCalendar();
    renderSummary();
  }

  function renderResultCalendar() {
    const cal = document.getElementById("result-calendar");
    if (!cal) return;
    document.getElementById("result-month-title").textContent = `${state.viewYear}년 ${state.viewMonth+1}월`;

    const today = new Date();
    today.setHours(0,0,0,0);

    const firstDay = new Date(state.viewYear, state.viewMonth, 1).getDay();
    const daysInMonth = new Date(state.viewYear, state.viewMonth+1, 0).getDate();

    cal.innerHTML = "";
    ["일","월","화","수","목","금","토"].forEach((l, idx) => {
      const cls = idx === 0 ? "sun" : idx === 6 ? "sat" : "";
      cal.innerHTML += `<div class="day-label ${cls}">${l}</div>`;
    });

    for (let i = 0; i < firstDay; i++) {
      cal.innerHTML += `<div class="day empty"></div>`;
    }

    const members = (state.room && state.room.members) || {};
    const memberArr = Object.values(members);
    const submittedArr = memberArr.filter(m => m.submitted);
    const maxMembers = (state.room && state.room.maxMembers) || 0;
    const allSubmitted = submittedArr.length === maxMembers && submittedArr.length > 0;

    for (let d = 1; d <= daysInMonth; d++) {
      const key = dateKey(state.viewYear, state.viewMonth, d);
      const dateObj = new Date(state.viewYear, state.viewMonth, d);
      const isPast = dateObj < today;

      let unavCount = 0;
      submittedArr.forEach(m => {
        if ((m.unavailable || []).includes(key)) unavCount++;
      });

      let cls = "day";
      if (isPast) cls += " past";
      else if (unavCount > 0) cls += " faded";
      else if (allSubmitted) cls += " highlighted";
      else cls += " available";

      const cell = document.createElement("div");
      cell.className = cls;
      cell.innerHTML = `${d}` + (unavCount > 0 ? `<span class="day-indicator">×${unavCount}</span>` : '');
      cal.appendChild(cell);
    }
  }

  function renderSummary() {
    const box = document.getElementById("summary-box");
    if (!box) return;
    const members = (state.room && state.room.members) || {};
    const memberArr = Object.values(members);
    const submittedArr = memberArr.filter(m => m.submitted);
    const maxMembers = (state.room && state.room.maxMembers) || 0;
    const submittedCount = submittedArr.length;

    if (submittedCount < maxMembers) {
      box.innerHTML = `
        <div class="summary-title">아직 ${maxMembers - submittedCount}명이 제출하지 않았어요</div>
        <div class="summary-empty">모두 제출하면 가능한 날이 노란색으로 하이라이팅됩니다</div>
      `;
      return;
    }

    const today = new Date();
    today.setHours(0,0,0,0);
    const availableDates = [];

    for (let i = 0; i < 60; i++) {
      const d = new Date(today);
      d.setDate(d.getDate() + i);
      const key = dateKey(d.getFullYear(), d.getMonth(), d.getDate());
      let allAvail = true;
      for (const m of submittedArr) {
        if ((m.unavailable || []).includes(key)) { allAvail = false; break; }
      }
      if (allAvail) {
        const days = ["일","월","화","수","목","금","토"];
        availableDates.push(`${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]})`);
      }
    }

    if (availableDates.length === 0) {
      box.innerHTML = `
        <div class="summary-title">앞으로 60일 내 모두 가능한 날이 없어요 😢</div>
        <div class="summary-empty">일정 조율이 필요해 보입니다</div>
      `;
    } else {
      box.innerHTML = `
        <div class="summary-title">🎉 모두 가능한 날 (앞으로 60일 내)</div>
        <div class="summary-dates">${availableDates.slice(0, 10).join(", ")}${availableDates.length > 10 ? ` 외 ${availableDates.length-10}일` : ''}</div>
      `;
    }
  }

  // ===== 시작 =====
  async function start() {
    // 1) 로컬 파일 감지 (file://, computer:// 등은 외부 fetch 불가)
    const proto = location.protocol;
    if (proto !== "http:" && proto !== "https:") {
      showLocalModeWarning();
      return;
    }

    setBanner("offline", "⏳ 클라우드 저장소 연결 중...");

    const params = new URLSearchParams(location.search);
    let roomId = params.get("room");

    try {
      if (!roomId) {
        // 새 방 생성: jsonblob에 빈 데이터 POST
        const newId = await createBlob({ __empty: true, createdAt: Date.now() });
        roomId = newId;
        params.set("room", roomId);
        history.replaceState(null, "", location.pathname + "?" + params.toString());
        state.room = null;
      } else {
        // 기존 방 데이터 불러오기
        const data = await readBlob(roomId);
        if (data && !data.__empty) {
          state.room = data;
        } else {
          state.room = null;
        }
      }

      window._roomId = roomId;
      initialDataLoaded = true;
      setBanner("online", "🟢 클라우드 저장소 연결됨 · 변경사항이 자동 저장됩니다");
      document.getElementById("loading").classList.add("hidden");
      routeToCorrectScreen();

    } catch (e) {
      console.error("Storage connection failed:", e);
      showNetworkError("저장소 연결 실패 (" + (e.message || "알 수 없는 오류") + ")");
    }
  }

  // 전역 노출
  window.changeMaxMembers = changeMaxMembers;
  window.createProject = createProject;
  window.joinAsMember = joinAsMember;
  window.leaveMyProfile = leaveMyProfile;
  window.changeMonth = changeMonth;
  window.toggleDay = toggleDay;
  window.resetCurrentUser = resetCurrentUser;
  window.submitAvailability = submitAvailability;
  window.showResults = showResults;
  window.refreshAndShowResults = refreshAndShowResults;
  window.goToCalendar = goToCalendar;
  window.copyRoomLink = copyRoomLink;
  window.refreshData = refreshData;

  start();
</script>
</body>
